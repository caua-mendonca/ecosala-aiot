# Servidor do frontend + proxy reverso para a API (única porta publicada)
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' ws: wss:; frame-ancestors 'none'" always;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;              # streaming do assistente palavra a palavra
        proxy_read_timeout 600s;
    }
    location /ws {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
    location = /docs {
        proxy_pass http://api:8000;
        add_header Content-Security-Policy "default-src 'self' https://cdn.jsdelivr.net 'unsafe-inline'; img-src 'self' data: https:" always;
    }
    location = /openapi.json { proxy_pass http://api:8000; }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
