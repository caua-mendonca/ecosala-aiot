name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr-title:
    name: Título do PR (Conventional Commits)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false

  secrets-scan:
    name: Varredura de segredos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest

  frontend:
    name: Frontend (type-check e build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run type-check
      - run: npm run build

  compose:
    name: Compose (dev e prod válidos)
    runs-on: ubuntu-latest
    env:
      GHCR_OWNER: ci
      IMAGE_TAG: ci
    steps:
      - uses: actions/checkout@v4
      - name: Gera segredos de teste
        run: python scripts/gerar_segredos.py
      - run: docker compose config -q
      - run: docker compose -f docker-compose.yml -f docker-compose.dev.yml config -q
      - run: docker compose -f docker-compose.yml -f docker-compose.prod.yml config -q

  smoke:
    name: Smoke test (sobe a pilha sem o LLM)
    needs: [backend, frontend, compose]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/gerar_segredos.py
      - name: Sobe API, gateway, simulador e frontend
        run: docker compose up -d --build --wait --wait-timeout 600 api gateway influx-writer inference simulator frontend
      - name: Verifica a API pelo proxy do frontend
        run: |
          for i in $(seq 1 20); do
            curl -fsS http://localhost:8080/api/v1/health && exit 0
            sleep 3
          done
          exit 1
      - name: Logs em caso de falha
        if: failure()
        run: docker compose logs --no-color --tail 80
      - if: always()
        run: docker compose down -v
