# Mosquitto - configuracao local do projeto EcoSala (1o bimestre)
#
# Execute sempre a partir da RAIZ do repositorio, para que os caminhos
# relativos abaixo resolvam corretamente:
#
#   mosquitto -c infra/mosquitto/mosquitto.conf -v
#
# No 2o bimestre este arquivo sera montado como volume de um container
# Docker, sem necessidade de alteracao (ver docs/arquitetura.md, secao 4.4).

# --- Rede ---
listener 1883 0.0.0.0
protocol mqtt

# --- Autenticacao ---
# allow_anonymous=false exige usuario/senha para conectar e publicar/assinar.
# O arquivo "passwd" (hash de senhas) e gerado localmente com mosquitto_passwd
# e NAO e versionado (ver infra/mosquitto/passwd.example para instrucoes).
allow_anonymous false
password_file infra/mosquitto/passwd

# --- Persistencia (retained messages, ex.: topico de status/LWT) ---
persistence true
persistence_location infra/mosquitto/data/

# --- Logs ---
log_dest file infra/mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# --- Keepalive ---
# Permite ate 60s sem mensagens antes de considerar a conexao perdida
# (o broker publica o LWT em ecosala/v1/{room_id}/{device_id}/status
# quando isso acontece).
max_keepalive 60
